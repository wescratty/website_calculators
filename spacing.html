<!DOCTYPE html>
<html>
<style>
    .table-wrapper {
        width: 100%;
        overflow-x: auto;
    }

    .layout-table {
        width: 100%;
        min-width: 700px;
        border-collapse: collapse;
        margin-top: 20px;
    }

    .layout-table th,
    .layout-table td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
        white-space: nowrap;
    }

    .layout-table th {
        background: #f5f5f5;
    }
</style>

<div id="calculator"></div>
<script>
    function getImperialSpinners(id) {
        const fractions = [
            "0",
            "1/16",
            "1/8",
            "3/16",
            "1/4",
            "5/16",
            "3/8",
            "7/16",
            "1/2",
            "9/16",
            "5/8",
            "11/16",
            "3/4",
            "13/16",
            "7/8",
            "15/16"
        ];

        // Feet options
        let feetOptions = "";
        for (let i = 0; i <= 30; i++) {
            feetOptions += `<option value="${i}">${i} ft</option>`;
        }

        // Inch options
        let inchOptions = "";
        for (let i = 0; i <= 11; i++) {
            inchOptions += `<option value="${i}">${i} in</option>`;
        }

        // Fraction options
        let fractionOptions = "";
        for (const fraction of fractions) {
            fractionOptions += `
      <option value="${fraction}">
        ${fraction}
      </option>
    `;
        }

        return `
    <div class="measurement-input">

      <select id="${id}Feet">
        ${feetOptions}
      </select>

      <select id="${id}Inches">
        ${inchOptions}
      </select>

      <select id="${id}Fraction">
        ${fractionOptions}
      </select>

    </div>
  `;
    }
    const calculator = document.getElementById("calculator");

    calculator.innerHTML = `
    <h4>Spacing Calculator</h4>
    <p>
      Quickly calculate spacing of deck boards, tile,
      balusters, or t-n-g!
    </p>
    <p>
          Note: Only calculates to the 32nd so may accumulate rounding errors on long runs.
    </p>

    <label>Average Material Width</label>
    ${getImperialSpinners("width")}

    <label>Total Coverage Area</label>
    ${getImperialSpinners("area")}

        <label>Max Gap</label>
    ${getImperialSpinners("maxGap")}

        <label>Min Gap</label>
    ${getImperialSpinners("minGap")}
     <button onclick="calculateGap()">
    Calculate
  </button>

  <h3 id="result"></h3>
  `;
</script>

<script>

    function formatInches(decimalInches) {

        const whole = Math.floor(decimalInches);

        const fraction = decimalInches - whole;

        const denominator = 32;

        let numerator = Math.round(fraction * denominator);

        // handle rollover
        if (numerator === denominator) {
            return `${whole + 1}"`;
        }

        // simplify fraction
        function gcd(a, b) {
            return b ? gcd(b, a % b) : a;
        }

        const divisor = gcd(numerator, denominator);

        const simplifiedNum = numerator / divisor;
        const simplifiedDen = denominator / divisor;

        if (numerator === 0) {
            return `${whole}"`;
        }

        return `${whole} ${simplifiedNum}/${simplifiedDen}"`;
    };

</script>

<script>
    function addImperial(ft, inch, frac) {
        let fracToDec = 0;
        if (frac !== "0") {
            const [numerator, denominator] =
                frac.split("/").map(Number);
            fracToDec = numerator / denominator;
        }

        console.log("ft, inch, frac, fracToDec", ft, inch, frac, fracToDec);
        return (ft * 12) + inch + fracToDec;
    }

    function solveLayout({
        totalWidth,
        materialWidth,
        minGap = 0,
        maxGap = 0,
        edgeGaps = false
    }) {
        console.log({ totalWidth });
        console.log({ materialWidth });
        console.log({ minGap });
        console.log({ maxGap });
        console.log({ edgeGaps });
        const results = [];
        const maxCount = Math.ceil(totalWidth / materialWidth) + 1;
        for (let count = 1; count <= maxCount; count++) {
            const gapCount = edgeGaps ? count + 1: count - 1;
                
            // Fixed-gap case
            if (minGap === maxGap) {

                const gap = minGap;

                const used =
                    (count * materialWidth)
                    +
                    (gapCount * gap);

                const remainder =
                    totalWidth - used;
                console.log({ remainder });
                if (remainder >= 0) {
                    console.log({ gap });
                    results.push({
                        count,
                        gap,
                        remainder
                    });
                }

            } else {

                // Adjustable-gap case
                console.log({ totalWidth, count, materialWidth, gapCount });
                const gap =
                    (totalWidth - (count * materialWidth))
                    / gapCount;
                console.log({ gap });
                if (gap == null) {
                    console.log({ totalWidth, count, materialWidth, gapCount });
                }

                else if (gap >= minGap && gap <= maxGap) {
                    console.log({ gap });
                    results.push({
                        count,
                        gap,
                        remainder: 0
                    });
                }
            }
        }

        return results;
    }

    function calculateGap() {
        const widthFeet = parseFloat(document.getElementById('widthFeet').value);
        const widthInches = parseFloat(document.getElementById('widthInches').value);
        const widthFraction = document.getElementById('widthFraction').value;
        const materialWidth = addImperial(widthFeet, widthInches, widthFraction);

        const areaFeet = parseFloat(document.getElementById('areaFeet').value);
        const areaInches = parseFloat(document.getElementById('areaInches').value);
        const areaFraction = document.getElementById('areaFraction').value;
        const totalWidth = addImperial(areaFeet, areaInches, areaFraction);

        const maxGapFeet = parseFloat(document.getElementById('maxGapFeet').value);
        const maxGapInches = parseFloat(document.getElementById('maxGapInches').value);
        const maxGapFraction = document.getElementById('maxGapFraction').value;
        const maxGap = addImperial(maxGapFeet, maxGapInches, maxGapFraction);

        const minGapFeet = parseFloat(document.getElementById('minGapFeet').value);
        const minGapInches = parseFloat(document.getElementById('minGapInches').value);
        const minGapFraction = document.getElementById('minGapFraction').value;
        const minGap = addImperial(minGapFeet, minGapInches, minGapFraction);

        const edgeGaps = !(minGap === 0 && maxGap === 0);
        const data = {
            totalWidth,
            materialWidth,
            minGap,
            maxGap,
            edgeGaps,
        };
        const results = solveLayout(data);

        if (!results.length) {

            document.getElementById("result").innerHTML = `
    No solutions found.<br>
    Try allowing a larger gap range.
  `;

            return;
        }

        // Tightest spacing
        const option1 = results[results.length - 1];

        // Slightly fewer boards
        const option2 = results[results.length - 2];

        // Another fallback
        //const option3 = results[results.length - 3];

        const options = [
            option1,
            option2,
            //option3
        ].filter(Boolean);

        function buildRow(option, index) {

            const gap = option.gap;

            // Equal edge margins
            const edgeSpace =
                (option.remainder / 2) + gap;

            // Optional ripped start/end boards
            const rippedBoard =
                (option.remainder + gap - materialWidth) / 2;

            if (gap === 0) {
                return `
    <tr>
      <td>Option ${index + 1}</td>

      <td>${option.count}</td>

      <td>${formatInches(gap)}</td>

      <td>${formatInches(option.remainder)}</td>

      <td>${formatInches(edgeSpace)}</td>

      <td>-</td>

    </tr>
  `;
            }
            else {
                return `
    <tr>
      <td>Option ${index + 1}</td>

      <td>${option.count + 1}</td>

      <td>${formatInches(gap)}</td>

      <td>${formatInches(option.remainder)}</td>

      <td>-</td>

      <td>${formatInches(rippedBoard)}</td>

    </tr>
  `;
            }


        }

        document.getElementById("result").innerHTML = `
 <div class="table-wrapper">
  <table class="layout-table">

    <thead>
      <tr>
        <th>Layout</th>
        <th>Boards</th>
        <th>Gap</th>
        <th>Remainder</th>
        <th>Start & End Rip</th>
        <th>Start & End Gap</th>
      </tr>
    </thead>

    <tbody>
      ${options.map(buildRow).join("")}
    </tbody>

  </table>
  </div>
`;
    };

</script>

</html>
