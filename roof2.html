<style>
  body {
    font-family: Arial, sans-serif;
  }

  .wrap {
    max-width: 1100px;
    margin: 20px auto;
  }

  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .card {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  label {
    display: block;
    margin-top: 10px;
    font-weight: 600;
  }

  input {
    width: 120px;
    padding: 6px;
    margin-top: 4px;
  }

  button {
    margin-top: 12px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .stock-bar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .stock {
    padding: 6px 10px;
    border: 1px solid #aaa;
    border-radius: 4px;
    font-size: 12px;
  }

  .stock.hit {
    background: #d6f5d6;
    border-color: #2e8b57;
  }

  .stock.fail {
    background: #ffe0e0;
  }

  svg {
    width: 100%;
    height: 420px;
    border: 1px solid #ccc;
    margin-top: 16px;
  }
</style>

<div class="wrap">

  <div class="card">
    <h3>Rafter Calculator</h3>

    <label>Building Width (ft)</label>
    <input id="width" type="number" value="20">

    <label>Pitch (rise per 12)</label>
    <input id="pitch" type="number" value="6">

    <label>Soffit (inches)</label>
    <input id="soffit" type="number" value="24">

    <label>Stand / Heel Height (inches)</label>
    <input id="stand" type="number" value="0">

    <label>
      <input type="checkbox" id="optimize">
      Optimize soffit for stock savings
    </label>

    <button onclick="run()">Calculate</button>
  </div>

  <div class="card" id="output"></div>

  <svg id="svg"></svg>

</div>

<script>
function computeGeometry(widthFt, pitch, soffitIn) {

  const run = widthFt * 12;
  const rise = (run / 12) * pitch;

  // main rafter (top edge)
  const common = Math.sqrt(run * run + rise * rise);

  // soffit projection
  const soffitRun = soffitIn;
  const soffitRise = (soffitRun / 12) * pitch;
  const soffit = Math.sqrt(soffitRun * soffitRun + soffitRise * soffitRise);

  const envelope = Math.sqrt(
    Math.pow(run + soffitRun, 2) +
    Math.pow(rise + soffitRise, 2)
  );

  return { run, rise, common, soffit, envelope };
}

function stockOptions(envelope) {

  const stock = [8,10,12,14,16,18,20,24];

  return stock.map(s => ({
    size: s,
    fits: envelope <= s * 12
  }));
}

function run() {

  const width = +document.getElementById("width").value;
  const pitch = +document.getElementById("pitch").value;
  let soffit = +document.getElementById("soffit").value;
  const optimize = document.getElementById("optimize").checked;

  const geo = computeGeometry(width, pitch, soffit);

  // OPTIONAL OPTIMIZATION (simple version)
  if (optimize) {
    const target = stockOptions(geo.envelope).find(s => s.fits);

    if (target) {
      // crude adjustment: reduce soffit until it just fits
      while (geo.envelope > target.size * 12 && soffit > 0) {
        soffit -= 1;
        Object.assign(geo, computeGeometry(width, pitch, soffit));
      }
    }
  }

  const stocks = stockOptions(geo.envelope);

  document.getElementById("output").innerHTML = `
    <h4>Results</h4>

    <p>Common Rafter: ${geo.common.toFixed(2)} in</p>
    <p>Envelope Length: ${geo.envelope.toFixed(2)} in</p>

    <div class="stock-bar">
      ${stocks.map(s => `
        <div class="stock ${s.fits ? "hit" : "fail"}">
          ${s.size}'
        </div>
      `).join("")}
    </div>
  `;

  drawSVG(geo);
}

function drawSVG(g) {

  const svg = document.getElementById("svg");

  const scale = 2;

  const run = g.run * scale;
  const rise = g.rise * scale;

  svg.innerHTML = `
    <line x1="50" y1="50" x2="${50+run}" y2="${50+rise}" stroke="black"/>
    <text x="50" y="40">Ridge</text>

    <line x1="50" y1="50" x2="50" y2="${50+rise}" stroke="blue" stroke-dasharray="4"/>
    <text x="55" y="${50+rise/2}">Plumb</text>

    <line x1="${50+run}" y1="${50+rise}" x2="${50+run+g.soffit}" y2="${50+rise + (g.soffit/12)*6}" stroke="green"/>
    <text x="${50+run}" y="${50+rise+20}">Soffit</text>
  `;
}

run();
</script>
