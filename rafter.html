<style>

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    margin-top: 20px;
}

.layout-table {
    width: 100%;
    min-width: 1000px;
    border-collapse: collapse;
}

.layout-table th,
.layout-table td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
    white-space: nowrap;
}

.layout-table th {
    background: #f5f5f5;
}

.measurement-input {
    margin-bottom: 20px;
}

.measurement-input select {
    margin-right: 6px;
    margin-top: 6px;
}

button {
    margin-top: 20px;
    padding: 10px 18px;
    cursor: pointer;
}

#rafterSvgWrapper {
    width: 100%;
    overflow: auto;
    border: 1px solid #ccc;
    margin-top: 30px;
    background: #fafafa;
}

#rafterSvg {
    min-width: 1400px;
    min-height: 700px;
}

.svg-line {
    stroke: black;
    stroke-width: 2;
    fill: none;
}

.svg-text {
    font-size: 12px;
    font-family: Arial;
}

.result-empty {
    border: 1px solid #ddd;
    padding: 14px;
    margin-top: 20px;
}

</style>



<div id="rafterCalculator">

    <h2>Rafter Calculator</h2>

    <p>
        Calculates common rafter geometry,
        tail length, birdsmouth layout,
        roof angle, and material count.
    </p>



    <label>Building Width</label>
    <div id="buildingWidthInputs"></div>



    <label>Building Length</label>
    <div id="buildingLengthInputs"></div>



    <label>Ridge Thickness</label>
    <div id="ridgeInputs"></div>



    <label>Roof Pitch</label>

    <div class="measurement-input">

        <select id="pitchRise">

            <option value="3">3/12</option>
            <option value="4">4/12</option>
            <option value="5">5/12</option>
            <option value="6" selected>6/12</option>
            <option value="7">7/12</option>
            <option value="8">8/12</option>
            <option value="9">9/12</option>
            <option value="10">10/12</option>
            <option value="12">12/12</option>

        </select>

    </div>



    <label>Rafter Depth</label>

    <div class="measurement-input">

        <select id="rafterDepth">

            <option value="5.5">2x6 (5.5")</option>
            <option value="7.25">2x8 (7.25")</option>
            <option value="9.25">2x10 (9.25")</option>
            <option value="11.25">2x12 (11.25")</option>

        </select>

    </div>



    <label>Wall Thickness</label>
    <div id="wallInputs"></div>



    <label>Soffit Overhang</label>
    <div id="soffitInputs"></div>



    <label>Rafter Spacing</label>

    <div class="measurement-input">

        <select id="ocSpacing">

            <option value="16">16" OC</option>
            <option value="24">24" OC</option>

        </select>

    </div>



    <button onclick="calculateRafters()">
        Calculate Rafters
    </button>



    <div id="result"></div>



    <div id="rafterSvgWrapper">

        <svg
            id="rafterSvg"
            viewBox="0 0 1600 900"
        ></svg>

    </div>

</div>



<script>

function getImperialSpinners(id) {

    const fractions = [
        "0",
        "1/16",
        "1/8",
        "3/16",
        "1/4",
        "5/16",
        "3/8",
        "7/16",
        "1/2",
        "9/16",
        "5/8",
        "11/16",
        "3/4",
        "13/16",
        "7/8",
        "15/16"
    ];

    let feetOptions = "";

    for (let i = 0; i <= 40; i++) {

        feetOptions += `
            <option value="${i}">
                ${i} ft
            </option>
        `;
    }

    let inchOptions = "";

    for (let i = 0; i <= 11; i++) {

        inchOptions += `
            <option value="${i}">
                ${i} in
            </option>
        `;
    }

    let fractionOptions = "";

    for (const fraction of fractions) {

        fractionOptions += `
            <option value="${fraction}">
                ${fraction}
            </option>
        `;
    }

    return `

        <div class="measurement-input">

            <select id="${id}Feet">
                ${feetOptions}
            </select>

            <select id="${id}Inches">
                ${inchOptions}
            </select>

            <select id="${id}Fraction">
                ${fractionOptions}
            </select>

        </div>
    `;
}



[
    "buildingWidth",
    "buildingLength",
    "ridge",
    "wall",
    "soffit"
].forEach(id => {

    document.getElementById(
        `${id}Inputs`
    ).innerHTML =
        getImperialSpinners(id);

});



function addImperial(ft, inch, frac) {

    let fracToDec = 0;

    if (frac !== "0") {

        const [n, d] =
            frac.split("/").map(Number);

        fracToDec = n / d;
    }

    return (ft * 12) + inch + fracToDec;
}



function formatInches(decimalInches) {

    const whole =
        Math.floor(decimalInches);

    const fraction =
        decimalInches - whole;

    const denominator = 32;

    let numerator =
        Math.round(fraction * denominator);

    if (numerator === denominator) {

        return `${whole + 1}"`;
    }

    function gcd(a, b) {

        return b
            ? gcd(b, a % b)
            : a;
    }

    const divisor =
        gcd(numerator, denominator);

    const simplifiedNum =
        numerator / divisor;

    const simplifiedDen =
        denominator / divisor;

    if (numerator === 0) {

        return `${whole}"`;
    }

    return `
        ${whole}
        ${simplifiedNum}/${simplifiedDen}"
    `;
}



function calculateRafters() {



    const buildingWidth =
        addImperial(
            parseFloat(document.getElementById('buildingWidthFeet').value),
            parseFloat(document.getElementById('buildingWidthInches').value),
            document.getElementById('buildingWidthFraction').value
        );



    const buildingLength =
        addImperial(
            parseFloat(document.getElementById('buildingLengthFeet').value),
            parseFloat(document.getElementById('buildingLengthInches').value),
            document.getElementById('buildingLengthFraction').value
        );



    const ridgeThickness =
        addImperial(
            parseFloat(document.getElementById('ridgeFeet').value),
            parseFloat(document.getElementById('ridgeInches').value),
            document.getElementById('ridgeFraction').value
        );



    const wallThickness =
        addImperial(
            parseFloat(document.getElementById('wallFeet').value),
            parseFloat(document.getElementById('wallInches').value),
            document.getElementById('wallFraction').value
        );



    const soffit =
        addImperial(
            parseFloat(document.getElementById('soffitFeet').value),
            parseFloat(document.getElementById('soffitInches').value),
            document.getElementById('soffitFraction').value
        );



    const pitch =
        parseFloat(
            document.getElementById("pitchRise").value
        );



    const rafterDepth =
        parseFloat(
            document.getElementById("rafterDepth").value
        );



    const ocSpacing =
        parseFloat(
            document.getElementById("ocSpacing").value
        );



    const run =
        (buildingWidth - ridgeThickness) / 2;



    const rise =
        (run / 12) * pitch;



    const roofAngle =
        Math.atan(
            pitch / 12
        ) * (180 / Math.PI);



    const commonLength =
        Math.sqrt(
            (run * run)
            +
            (rise * rise)
        );



    const overhangRun =
        soffit;



    const tailLength =
        Math.sqrt(
            (overhangRun * overhangRun)
            +
            (
                ((overhangRun / 12) * pitch)
                *
                ((overhangRun / 12) * pitch)
            )
        );



    const totalLength =
        commonLength + tailLength;



    const birdsmouthSeat =
        wallThickness;



    const heelHeight =
        rafterDepth
        -
        (
            wallThickness
            *
            (pitch / 12)
        );



    const rafterPairs =
        Math.ceil(
            buildingLength / ocSpacing
        ) + 1;



    const totalRafters =
        rafterPairs * 2;



    const plumbCut =
        90 - roofAngle;



    document.getElementById("result").innerHTML = `

        <div class="table-wrapper">

            <table class="layout-table">

                <thead>

                    <tr>

                        <th>Field</th>

                        <th>Value</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>Roof Pitch</td>
                        <td>${pitch}/12</td>
                    </tr>

                    <tr>
                        <td>Roof Angle</td>
                        <td>${roofAngle.toFixed(2)}°</td>
                    </tr>

                    <tr>
                        <td>Common Run</td>
                        <td>${formatInches(run)}</td>
                    </tr>

                    <tr>
                        <td>Total Rise</td>
                        <td>${formatInches(rise)}</td>
                    </tr>

                    <tr>
                        <td>Common Rafter Length</td>
                        <td>${formatInches(commonLength)}</td>
                    </tr>

                    <tr>
                        <td>Tail Length</td>
                        <td>${formatInches(tailLength)}</td>
                    </tr>

                    <tr>
                        <td>Total Stock Length</td>
                        <td>${formatInches(totalLength)}</td>
                    </tr>

                    <tr>
                        <td>Birdsmouth Seat</td>
                        <td>${formatInches(birdsmouthSeat)}</td>
                    </tr>

                    <tr>
                        <td>Heel Height</td>
                        <td>${formatInches(heelHeight)}</td>
                    </tr>

                    <tr>
                        <td>Top Plumb Cut</td>
                        <td>${plumbCut.toFixed(2)}°</td>
                    </tr>

                    <tr>
                        <td>Rafter Pairs</td>
                        <td>${rafterPairs}</td>
                    </tr>

                    <tr>
                        <td>Total Rafters</td>
                        <td>${totalRafters}</td>
                    </tr>

                </tbody>

            </table>

        </div>
    `;



    renderRafterSvg({

        run,
        rise,
        soffit,
        totalLength,
        commonLength,
        tailLength,
        birdsmouthSeat,
        heelHeight,
        roofAngle

    });

}



function renderRafterSvg(data) {

    const svg =
        document.getElementById("rafterSvg");



    svg.innerHTML = "";



    const scale = 3;



    const startX = 200;

    const startY = 700;



    const run =
        data.run * scale;

    const rise =
        data.rise * scale;

    const soffit =
        data.soffit * scale;



    const ridgeX =
        startX + run;

    const ridgeY =
        startY - rise;



    const tailX =
        startX - soffit;

    const tailY =
        startY
        -
        (
            (data.soffit / 12)
            *
            (rise / (data.run / scale))
            *
            scale
        );



    const path =
        `
        M ${tailX} ${tailY}
        L ${ridgeX} ${ridgeY}
    `;



    const rafter =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );



    rafter.setAttribute("d", path);

    rafter.setAttribute(
        "class",
        "svg-line"
    );



    svg.appendChild(rafter);



    function addText(x, y, text) {

        const label =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        label.setAttribute("x", x);

        label.setAttribute("y", y);

        label.setAttribute(
            "class",
            "svg-text"
        );

        label.textContent = text;

        svg.appendChild(label);
    }



    addText(
        ridgeX - 120,
        ridgeY - 20,
        `Common Length: ${formatInches(data.commonLength)}`
    );



    addText(
        tailX - 20,
        tailY - 20,
        `Tail: ${formatInches(data.tailLength)}`
    );



    addText(
        startX + 50,
        startY + 40,
        `Run: ${formatInches(data.run)}`
    );



    addText(
        startX - 120,
        startY - 120,
        `Rise: ${formatInches(data.rise)}`
    );



    addText(
        ridgeX - 50,
        ridgeY + 30,
        `${data.roofAngle.toFixed(2)}°`
    );



    const wall =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );



    wall.setAttribute(
        "x1",
        startX
    );

    wall.setAttribute(
        "y1",
        startY
    );

    wall.setAttribute(
        "x2",
        startX
    );

    wall.setAttribute(
        "y2",
        startY - 120
    );

    wall.setAttribute(
        "class",
        "svg-line"
    );



    svg.appendChild(wall);



    const ridge =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );



    ridge.setAttribute(
        "x1",
        ridgeX
    );

    ridge.setAttribute(
        "y1",
        ridgeY
    );

    ridge.setAttribute(
        "x2",
        ridgeX
    );

    ridge.setAttribute(
        "y2",
        ridgeY + 100
    );

    ridge.setAttribute(
        "class",
        "svg-line"
    );



    svg.appendChild(ridge);
}

</script>
