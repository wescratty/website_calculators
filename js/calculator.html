<style>

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    margin-bottom: 40px;
}

.layout-table {
    width: 100%;
    min-width: 700px;
    border-collapse: collapse;
    margin-top: 12px;
}

.layout-table th,
.layout-table td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
    white-space: nowrap;
}

.layout-table th {
    background: #f5f5f5;
}

.measurement-input {
    margin-bottom: 20px;
}

.measurement-input select {
    margin-right: 6px;
    margin-top: 6px;
}

.layout-section {
    margin-top: 40px;
}

.layout-section h3 {
    margin-bottom: 10px;
}

.layout-section pre {
    background: #f5f5f5;
    padding: 10px;
    overflow-x: auto;
}

button {
    margin-top: 20px;
    padding: 10px 18px;
    cursor: pointer;
}

.result-empty {
    padding: 14px;
    border: 1px solid #ddd;
    margin-top: 12px;
}

#gapError {
    color: #b00020;
    margin-left: 10px;
    font-size: 0.9em;
}

</style>



<div id="calculator">

    <h2>Spacing Calculator</h2>

    <p>
        Quickly calculate spacing for decking,
        flooring, tile, balusters, paneling,
        soffit tails, fencing, and more.
    </p>

    <p>
        Note: calculations round to the nearest
        1/32" and long runs may accumulate
        small rounding differences.
    </p>



    <label>Material Width</label>
    <div id="widthInputs"></div>


    <label>Total Area Width</label>
    <span id="gapError"></span>
    <div id="areaInputs"></div>


    <label>Minimum Gap (Optional)</label>
    <div id="minGapInputs"></div>


    <label>Maximum Gap (Optional)</label>
    <div id="maxGapInputs"></div>


    <button onclick="calculateLayouts()">
        Calculate Layouts
    </button>



    <div id="result"></div>

</div>



<script>

function validateWidthAndArea() {

    const width = addImperial(
        parseFloat(document.getElementById('widthFeet').value),
        parseFloat(document.getElementById('widthInches').value),
        document.getElementById('widthFraction').value
    );

    const area = addImperial(
        parseFloat(document.getElementById('areaFeet').value),
        parseFloat(document.getElementById('areaInches').value),
        document.getElementById('areaFraction').value
    );

    const error =
        document.getElementById("gapError");

    if (width > area) {

        error.textContent =
            "Total area width must be greater than material width.";

        return false;
    }
    else if (width === 0 || area === 0) {

        error.textContent =
            "Material width and total area width must be greater than zero.";

        return false;
    }

    error.textContent = "";

    return true;
}

function syncGapInputs(changed) {

    const minGap = addImperial(
        parseFloat(document.getElementById('minGapFeet').value),
        parseFloat(document.getElementById('minGapInches').value),
        document.getElementById('minGapFraction').value
    );

    const maxGap = addImperial(
        parseFloat(document.getElementById('maxGapFeet').value),
        parseFloat(document.getElementById('maxGapInches').value),
        document.getElementById('maxGapFraction').value
    );



    // If min became larger than max
    if (minGap > maxGap) {

        // Copy min -> max
        if (changed === "min") {

            document.getElementById('maxGapFeet').value =
                document.getElementById('minGapFeet').value;

            document.getElementById('maxGapInches').value =
                document.getElementById('minGapInches').value;

            document.getElementById('maxGapFraction').value =
                document.getElementById('minGapFraction').value;
        }



        // Copy max -> min
        else {

            document.getElementById('minGapFeet').value =
                document.getElementById('maxGapFeet').value;

            document.getElementById('minGapInches').value =
                document.getElementById('maxGapInches').value;

            document.getElementById('minGapFraction').value =
                document.getElementById('maxGapFraction').value;
        }
    }
}

function getImperialSpinners(id) {

    const fractions = [
        "0",
        "1/16",
        "1/8",
        "3/16",
        "1/4",
        "5/16",
        "3/8",
        "7/16",
        "1/2",
        "9/16",
        "5/8",
        "11/16",
        "3/4",
        "13/16",
        "7/8",
        "15/16"
    ];

    let feetOptions = "";

    for (let i = 0; i <= 30; i++) {

        feetOptions += `
            <option value="${i}">
                ${i} ft
            </option>
        `;
    }

    let inchOptions = "";

    for (let i = 0; i <= 11; i++) {

        inchOptions += `
            <option value="${i}">
                ${i} in
            </option>
        `;
    }

    let fractionOptions = "";

    for (const fraction of fractions) {

        fractionOptions += `
            <option value="${fraction}">
                ${fraction}
            </option>
        `;
    }

    return `

        <div class="measurement-input">

            <select id="${id}Feet">
                ${feetOptions}
            </select>

            <select id="${id}Inches">
                ${inchOptions}
            </select>

            <select id="${id}Fraction">
                ${fractionOptions}
            </select>

        </div>
    `;
}



document.getElementById("widthInputs").innerHTML =
    getImperialSpinners("width");

document.getElementById("areaInputs").innerHTML =
    getImperialSpinners("area");

document.getElementById("minGapInputs").innerHTML =
    getImperialSpinners("minGap");

document.getElementById("maxGapInputs").innerHTML =
    getImperialSpinners("maxGap");


[
    "minGapFeet",
    "minGapInches",
    "minGapFraction"
].forEach(id => {

    document
        .getElementById(id)
        .addEventListener(
            "change",
            () => syncGapInputs("min")
        );

});



[
    "maxGapFeet",
    "maxGapInches",
    "maxGapFraction"
].forEach(id => {

    document
        .getElementById(id)
        .addEventListener(
            "change",
            () => syncGapInputs("max")
        );

});

function addImperial(ft, inch, frac) {

    let fracToDec = 0;

    if (frac !== "0") {

        const [n, d] =
            frac.split("/").map(Number);

        fracToDec = n / d;
    }

    return (ft * 12) + inch + fracToDec;
}



function formatInches(decimalInches) {

    if (decimalInches < 0) {
        return "-";
    }

    const whole =
        Math.floor(decimalInches);

    const fraction =
        decimalInches - whole;

    const denominator = 32;

    let numerator =
        Math.round(fraction * denominator);

    if (numerator === denominator) {

        return `${whole + 1}"`;
    }

    function gcd(a, b) {

        return b
            ? gcd(b, a % b)
            : a;
    }

    const divisor =
        gcd(numerator, denominator);

    const simplifiedNum =
        numerator / divisor;

    const simplifiedDen =
        denominator / divisor;

    if (numerator === 0) {

        return `${whole}"`;
    }

    return `
        ${whole}
        ${simplifiedNum}/${simplifiedDen}"
    `;
}



function solveTightLayout({
    totalWidth,
    materialWidth
}) {

    const count =
        Math.floor(totalWidth / materialWidth);

    const used =
        count * materialWidth;

    const remainder =
        totalWidth - used;

    return [{
        count,
        remainder,
        singleRip: remainder,
        splitRip: remainder / 2
    }];
}



function solveFixedGapLayout({
    totalWidth,
    materialWidth,
    minGap,
    maxGap
}) {

    const results = [];

    for (let count = 1; count < 200; count++) {

        for (
            let gap = minGap;
            gap <= maxGap;
            gap += 1/32
        ) {

            const gapCount =
                count - 1;

            const used =
                (count * materialWidth)
                +
                (gapCount * gap);

            const remainder =
                totalWidth - used;

            if (remainder < 0) {
                continue;
            }

            results.push({
                count,
                gap,
                singleRip: remainder,
                splitRip: remainder / 2,
                edgeGap: remainder / 2
            });
        }
    }

    return results;
}



function solveEqualGapLayout({
    totalWidth,
    materialWidth,
    minGap,
    maxGap
}) {

    const results = [];

    for (let count = 1; count < 200; count++) {

        const gap =
            (
                totalWidth
                -
                (count * materialWidth)
            )
            /
            (count + 1);

        if (
            gap >= minGap
            &&
            gap <= maxGap
        ) {

            results.push({
                count,
                gap
            });
        }
    }

    return results;
}


function solveEqualGapExceptEndsLayout({
    totalWidth,
    materialWidth,
    minGap,
    maxGap
}) {

    const results = [];

    for (let count = 1; count < 200; count++) {

        const endGap = (totalWidth - (count * materialWidth) + ((count - 1) * maxGap)) / (count + 1) / 2;

        if (
            endGap >= minGap
            &&
            endGap <= maxGap
        ) {

            results.push({
                count,
                endGap
            });
        }
    }

    return results;
}



function solveMaxFillLayout({
    totalWidth,
    materialWidth,
    maxGap
}) {

    let best = null;

    for (let count = 1; count < 200; count++) {

        const gap =
            (
                totalWidth
                -
                (count * materialWidth)
            )
            /
            (count + 1);

        if (gap < 0) {
            break;
        }

        if (gap <= maxGap) {

            best = {
                count,
                gap
            };
        }
    }

    return best
        ? [best]
        : [];
}



function renderTable({
    title,
    description,
    diagram,
    headers,
    rows
}) {

    if (!rows.length) {

        return `

            <div class="layout-section">

                <h3>${title}</h3>

                <p>${description}</p>

                <pre>${diagram}</pre>

                <div class="result-empty">
                    No valid solutions found.
                </div>

            </div>
        `;
    }

    return `

        <div class="layout-section">

            <h3>${title}</h3>

            <p>${description}</p>

            <pre>${diagram}</pre>

            <div class="table-wrapper">

                <table class="layout-table">

                    <thead>
                        <tr>
                            ${headers}
                        </tr>
                    </thead>

                    <tbody>
                        ${rows.join("")}
                    </tbody>

                </table>

            </div>

        </div>
    `;
}



function calculateLayouts() {

    if (!validateWidthAndArea()) {
    return;
    }

    const materialWidth = addImperial(
        parseFloat(document.getElementById('widthFeet').value),
        parseFloat(document.getElementById('widthInches').value),
        document.getElementById('widthFraction').value
    );



    const totalWidth = addImperial(
        parseFloat(document.getElementById('areaFeet').value),
        parseFloat(document.getElementById('areaInches').value),
        document.getElementById('areaFraction').value
    );



    const minGap = addImperial(
        parseFloat(document.getElementById('minGapFeet').value),
        parseFloat(document.getElementById('minGapInches').value),
        document.getElementById('minGapFraction').value
    );



    const maxGap = addImperial(
        parseFloat(document.getElementById('maxGapFeet').value),
        parseFloat(document.getElementById('maxGapInches').value),
        document.getElementById('maxGapFraction').value
    );



    const data = {
        totalWidth,
        materialWidth,
        minGap,
        maxGap
    };



    const tight =
        solveTightLayout(data);

    const fixedGap =
        solveFixedGapLayout(data)
        .slice(-3)
        .reverse();

    const equalGap =
        solveEqualGapLayout(data)
        .slice(-3)
        .reverse();

    const equalGapExceptEnds =
        solveEqualGapExceptEndsLayout(data)
        .slice(-3)
        .reverse();

    const maxFill =
        solveMaxFillLayout(data);



    let html = "";



    html += renderTable({

        title: "Tight / Centered Layout",

        description:
            "No intentional gaps. Common for flooring, paneling, tongue-and-groove, and finish carpentry.",

        diagram:
`| rip | board | board | rip |`,

        headers: `
            <th>Boards</th>
            <th>Remainder</th>
            <th>Single Edge Rip</th>
            <th>Split Edge Rips</th>
        `,

        rows: tight.map(option => `

            <tr>
                <td>${option.count}</td>

                <td>
                    ${formatInches(option.remainder)}
                </td>

                <td>
                    ${formatInches(option.singleRip)}
                </td>

                <td>
                    ${formatInches(option.splitRip)}
                </td>
            </tr>

        `)

    });



    html += renderTable({

        title: "Fixed Field Gap",

        description:
            "Uses fixed spacing between materials. Common for decking, tile, fencing, siding reveals, and brick layouts.",

        diagram:
`| board | gap | board | gap | board |`,

        headers: `
            <th>Boards</th>
            <th>Gap</th>
            <th>Single Edge Rip</th>
            <th>Split Edge Rips</th>
            <th>Equal Edge Gaps</th>
        `,

        rows: fixedGap.map(option => `

            <tr>

                <td>${option.count}</td>

                <td>
                    ${formatInches(option.gap)}
                </td>

                <td>
                    ${formatInches(option.singleRip)}
                </td>

                <td>
                    ${formatInches(option.splitRip)}
                </td>

                <td>
                    ${formatInches(option.edgeGap)}
                </td>

            </tr>

        `)

    });



    html += renderTable({

        title: "Equal Gaps Everywhere",

        description:
            "Creates equal spacing at both ends and throughout the field. Common for balusters, pergolas, soffit tails, and decorative slat layouts.",

        diagram:
`| gap | board | gap | board | gap |`,

        headers: `
            <th>Boards</th>
            <th>Equal Gap</th>
        `,

        rows: equalGap.map(option => `

            <tr>

                <td>${option.count}</td>

                <td>
                    ${formatInches(option.gap)}
                </td>

            </tr>

        `)

    });



    html += renderTable({

        title: "Equal Gaps with smaller gaps on the ends",

        description:
            "Creates equal spacing at both ends with specified gap throughout the field. Common for balusters, pergolas, soffit tails, and decorative slat layouts.",

        diagram:
`| smaller gap | board | gap | board | smaller gap |`,

        headers: `
            <th>Boards</th>
            <th>Equal Gap except ends</th>
        `,

        rows: equalGapExceptEnds.map(option => `

            <tr>

                <td>${option.count}</td>

                <td>
                    ${formatInches(option.gap)}
                </td>

            </tr>

        `)

    });



    html += renderTable({

        title: "Max Fill / Code Layout",

        description:
            "Maximizes material quantity while staying below a maximum spacing limit. Common for code-compliant railings and fencing.",

        diagram:
`| small gap | board | small gap |`,

        headers: `
            <th>Boards</th>
            <th>Gap</th>
        `,

        rows: maxFill.map(option => `

            <tr>

                <td>${option.count}</td>

                <td>
                    ${formatInches(option.gap)}
                </td>

            </tr>

        `)

    });



    document.getElementById("result").innerHTML =
        html;
}

</script>
