<div class="concrete-calculator">
<H4>Concrete Calculator</H4>
  <label>Length (feet)</label>
  <input type="number" id="length">

  <label>Width (feet)</label>
  <input type="number" id="width">

  <label>Thickness (inches)</label>
  <input type="number" id="thickness">

  <button onclick="calculateConcrete()">
    Calculate
  </button>

  <h3 id="result"></h3>

</div>

<script>
function calculateConcrete() {

  const length =
    parseFloat(document.getElementById('length').value) || 0;

  const width =
    parseFloat(document.getElementById('width').value) || 0;

  const thickness =
    parseFloat(document.getElementById('thickness').value) || 0;

  const yards =
    (length * width * thickness) / 324;

  document.getElementById('result').innerHTML =
    yards.toFixed(2) + ' cubic yards required';

}
</script>
