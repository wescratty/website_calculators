<!--
  Hip/Valley Sheet Angle Calculator
  ====================================
  Given the pitches of the two roof planes meeting at a hip or valley,
  finds the angle each plane's sheathing needs to be cut at along that
  line, plus where to strike that cut line from the corner of a 4x8
  sheet so it can be marked and cut without a protractor.
-->
<div class="Hip-Valley-Sheet-Angle-calculator">
<H4>Hip/Valley Sheet Angle</H4>
  <p>
    Quickly calculate hip and valley roof sheeting angles from roof pitch (e.g. 4/12, 8/12). Designed for roof framing, sheet cutting, and construction planning.
  </p>
  <p>
  <label>Plane 1 slope</label>
  <input type="number" id="p1" min="1" step="1">/12 pitch
</p>
  <p>
  <label>Plane 2 slope</label>
  <input type="number" id="p2" min="1" step="1">/12 pitch
</p>

  <button onclick="calculateAngle()">
    Calculate
  </button>

  <h3 id="result"></h3>

</div>
<canvas id="sheetCanvas1" width="500" height="300"></canvas>
<canvas id="sheetCanvas2" width="500" height="300"></canvas>

<script>
  // Converts decimal inches back into a "whole fraction/16ths" display
  // string, e.g. 15.5 -> `15 1/2"`. Rounds to the nearest 1/16" and
  // reduces the fraction (e.g. 8/16 -> 1/2) via gcd.
  function formatInches(decimalInches) {

  const whole = Math.floor(decimalInches);

  const fraction = decimalInches - whole;

  const denominator = 16;

  let numerator = Math.round(fraction * denominator);

  // handle rollover
  if (numerator === denominator) {
    return `${whole + 1}"`;
  }

  // simplify fraction
  function gcd(a, b) {
    return b ? gcd(b, a % b) : a;
  }

  const divisor = gcd(numerator, denominator);

  const simplifiedNum = numerator / divisor;
  const simplifiedDen = denominator / divisor;

  if (numerator === 0) {
    return `${whole}"`;
  }

  return `${whole} ${simplifiedNum}/${simplifiedDen}"`;
};
  
// Draws a 4x8 sheet with a diagonal cut line at the given angle, struck
// from the bottom-left corner, so it can be marked out on a real sheet
// without a protractor - just measure `dist` up from that corner.
function drawSheet(canvasId, angleDeg, dist) {

  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");


  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // scale (pixels per inch)
  const scale = 4;

  const sheetW = 96 * scale; // 8 ft
  const sheetH = 48 * scale; // 4 ft

  const offset = (48 / Math.tan(angleDeg * Math.PI / 180)); // inches
  const cutX = offset * scale;

  // origin (top-left margin)
  const ox = 40;
  const oy = 30;

  // draw sheet
  ctx.strokeStyle = "#000";
  ctx.strokeRect(ox, oy, sheetW, sheetH);

  // draw diagonal cut line
  ctx.strokeStyle = "red";
  ctx.beginPath();
  ctx.moveTo(ox, oy + sheetH);                 // bottom-left
  ctx.lineTo(ox + cutX, oy);                   // top edge point
  ctx.stroke();

  // label
  ctx.fillStyle = "black";
  ctx.font = "12px Arial";
ctx.fillText(`4x8 Sheet, pull from corner ${dist} in.`, ox, oy - 5);
  ctx.fillText("Cut Line", ox + cutX + 5, oy + 20);
}
</script>
<script>
// For a given cut angle, finds how far up a 4ft sheet edge to strike
// the cut line so it lands at that angle from the corner:
// rise / tan(angle) = the horizontal pull-back distance.
function getDistFromCorner(angleDeg) {
  const rise = 48; // 4 ft in inches
  const theta = angleDeg * Math.PI / 180;

  return rise / Math.tan(theta);
};

// Computes the sheathing cut angle on each side of a hip/valley from
// the two meeting roof pitches (p1, p2, expressed as rise/12).
//
// This is a standard hip/valley "dihedral angle" formula: it treats
// each roof plane as tilted by atan(pitch) from horizontal, finds the
// angle between the valley line and each plane's eave line, and takes
// the complement (90 - angle) to get the angle actually measured off
// the sheet's square edge when marking a cut.
function calculateAngle() {
  const p1 = parseFloat(document.getElementById('p1').value)/12 || 0;
  const p2 = parseFloat(document.getElementById('p2').value)/12 || 0;

  if (!p1 || p1 <= 0) {
    document.getElementById('result').innerHTML =
      "Plane 1 slope must be greater than 0";
    return;
  }
  if (!p2 || p2 <= 0) {
    document.getElementById('result').innerHTML =
      "Plane 2 slope must be greater than 0";
    return;
  }

  // Valley/hip angle measured within each plane.
  const a1 = Math.acos(
      (p2 * (1 + p1 * p1)) /
      (
          Math.sqrt(1 + p1 * p1) *
          Math.sqrt(p1 * p1 + p2 * p2 + p1 * p1 * p2 * p2)
      )
  );

  const a2 = Math.acos(
      (p1 * (1 + p2 * p2)) /
      (
          Math.sqrt(1 + p2 * p2) *
          Math.sqrt(p1 * p1 + p2 * p2 + p1 * p1 * p2 * p2)
      )
  );

  const d1 = a1 * 180 / Math.PI;
  const d2 = a2 * 180 / Math.PI;

  // Complementary "inside valley" angles: the angle to strike the
  // cut line at, measured from the sheet's square edge.
  const valley1 = 90 - d1;
  const valley2 = 90 - d2;

  const v1Dist = getDistFromCorner(valley1);
  const v2Dist = getDistFromCorner(valley2);

  const v1Inch = formatInches(v1Dist);
  const v2Inch = formatInches(v2Dist);

  document.getElementById('result').innerHTML = `
  Plane 1 valley angle: ${valley1.toFixed(2)}°<br>
  Pull from corner (Plane 1): ${v1Inch} inches<br><br>

  Plane 2 valley angle: ${valley2.toFixed(2)}°<br>
  Pull from corner (Plane 2): ${v2Inch} inches
`;

  drawSheet("sheetCanvas1", valley1, v1Inch);
  drawSheet("sheetCanvas2", valley2, v2Inch);
};
  
</script>
